<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Memora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: left rail of modules on wide screens, scrollable top tabs on phones; content in one column of cards by role. Dark-first. */
:root{
  --bg:#0e1116; --panel:#151a22; --panel2:#1b212b; --line:#262e3a; --fg:#e7ebf2; --muted:#8d98aa;
  --accent:#f0a948; --accent-ink:#1a1206; --ok:#4cc38a; --warn:#e8b33f; --orange:#ff8a3d; --bad:#ef6b6b; --info:#6aa7ff;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; color-scheme:dark;
}
:root.light{ --bg:#f4f5f8; --panel:#ffffff; --panel2:#eef0f5; --line:#dde1ea; --fg:#151a22; --muted:#5d6779; --accent-ink:#1a1206; --ok:#23915f; --warn:#b07a12; --orange:#d5631a; --bad:#d23f3f; --info:#2f6fd6; color-scheme:light }
:root[data-accent="coral"]{--accent:#ff7f66}
:root[data-accent="menta"]{--accent:#3fc9a5}
:root[data-accent="azul"]{--accent:#6aa7ff;--accent-ink:#06121f}
:root[data-accent="lilas"]{--accent:#b49cff;--accent-ink:#130b2a}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:36px;height:36px;display:grid;place-items:center;flex:none}.brand .logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand b{font-family:var(--f-display);font-size:1.2rem}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--panel2);color:var(--fg)}
.nav a.on{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{margin-left:auto;font-size:.75rem;background:var(--line);color:var(--fg);border-radius:20px;padding:0 7px;font-variant-numeric:tabular-nums}
.nav svg{width:18px;height:18px;flex:none}
.sync{margin-top:auto;padding:10px 12px;font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.bad{background:var(--bad)}
main{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{margin-bottom:10px}
.ttl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ttl h2{margin:0}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-mono);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.sub{color:var(--muted);font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
a.btn{text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.field>span{font-size:.78rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"";width:9px;height:5px;border:2px solid #08130d;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:20px;padding:2px 8px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill.alta{color:var(--bad)} .pill.media{color:var(--warn)} .pill.baixa{color:var(--muted)}
.pill.late{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);border-color:transparent}
.icon-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:grid;place-items:center}
.icon-btn:hover{color:var(--fg);background:var(--panel2)}
.icon-btn svg{width:16px;height:16px}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:10px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--fg)}
.bar{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:8px}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:6px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.chart .c .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.chart .c .b{width:100%;max-width:38px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.chart .c .b.today{box-shadow:0 0 0 2px var(--fg) inset}
.chart .c small{font-size:.7rem;color:var(--muted);white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;padding:5px 0}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .v{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
/* timer */
.timer{font-family:var(--f-mono);font-size:clamp(2.6rem,9vw,4.4rem);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:6px 0}
.ring{display:flex;justify-content:center}
/* week agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;min-height:160px}
.day.today{border-color:var(--accent)}
.day h3{font-size:.9rem;display:flex;justify-content:space-between}
.blk{border-radius:8px;padding:6px 8px;background:var(--panel2);border-left:3px solid var(--c,var(--accent));cursor:pointer;font-size:.82rem}
.blk b{display:block;font-weight:600;overflow-wrap:anywhere}
.blk span{color:var(--muted);font-family:var(--f-mono);font-size:.74rem}
.scroll-x{overflow-x:auto}
/* flashcards */
.deck{display:flex;flex-direction:column;gap:10px}
.deck .nums{display:flex;gap:12px;font-size:.82rem}
.n-new{color:var(--info)} .n-due{color:var(--ok)} .n-lrn{color:var(--bad)}
.study{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.fc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;min-height:240px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.fc .q{font-size:1.25rem;font-weight:600;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere}
.fc .a{font-size:1.05rem;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px dashed var(--line);padding-top:16px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 6px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button small{font-weight:500;color:var(--muted);font-family:var(--f-mono);font-size:.72rem}
.rate .r0{color:var(--bad)} .rate .r1{color:var(--warn)} .rate .r2{color:var(--ok)} .rate .r3{color:var(--info)}
.rate button:hover{background:var(--panel2)}
.kbd{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
/* AI */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--fg)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:.7rem;text-align:center;padding:4px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1;z-index:1}
.gen{display:flex;flex-direction:column;gap:8px}
.gcard{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.gcard textarea{min-height:60px;font-size:.88rem}
.gcard.off{opacity:.45}
.note{border-radius:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);font-size:.88rem}
.note.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.note.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.note.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
code,.mono{font-family:var(--f-mono);font-size:.82rem}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;font-size:.74rem;max-height:140px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,7,10,.62);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--fg)}
.countdown{font-family:var(--f-mono);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;font-size:.85rem;text-align:left}
.linkbtn:hover{color:var(--fg)}
.item.click{cursor:pointer;border-radius:8px}.item.click:hover{background:var(--panel2)}
.folder{cursor:pointer;display:flex;flex-direction:column;gap:8px}.folder:hover{border-color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;flex:1;min-width:60px}.spark i{flex:1;max-width:12px;border-radius:2px;min-height:3px}
.expl{margin:-4px 0 10px;max-width:70ch}
/* pie */
.pie{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none;transform:none}
.donut .dc{fill:var(--fg);font:700 5px var(--f-mono);text-anchor:middle}
.donut .ds{fill:var(--muted);font:500 2.6px var(--f-body);text-anchor:middle}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:190px;display:flex;flex-direction:column;gap:7px}
.legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:.88rem}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.legend .v{font-family:var(--f-mono);color:var(--muted);font-size:.78rem;min-width:52px;text-align:right}
/* tasks doing */
.chk.doing{border-color:var(--accent)}
.chk.doing::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent)}
.pill.tt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill.tt.run{color:var(--accent);border-color:var(--accent)}
.card-doing{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
/* exam tasks */
.urg-u0{color:var(--fg)} .urg-u1{color:var(--warn)} .urg-u2{color:var(--orange)} .urg-u3,.urg-u4{color:var(--bad)} .urg-past{color:var(--muted)}
a.urg-u1,a.urg-u2,a.urg-u3,a.urg-u4,a.urg-u0{text-decoration:none;font-weight:600;display:block;margin-top:2px}
.etasks{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.etask{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--line)}
.etask .t{flex:1;min-width:0;overflow-wrap:anywhere}
.etask.u1{border-left-color:var(--warn)}.etask.u1 .t{color:var(--warn)}
.etask.u2{border-left-color:var(--orange)}.etask.u2 .t{color:var(--orange)}
.etask.u3{border-left-color:var(--bad)}.etask.u3 .t{color:var(--bad)}
.etask.u4{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel2))}.etask.u4 .t{color:var(--bad);font-weight:700}
.etask.past .t{color:var(--muted)}
.etask.ok{border-left-color:var(--ok)}.etask.ok .t{text-decoration:line-through;color:var(--muted)}
.legend-row{gap:12px}
.lg{display:inline-flex;align-items:center;gap:5px}.lg::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--line)}
.lg.u1::before{background:var(--warn)}.lg.u2::before{background:var(--orange)}.lg.u3::before{background:var(--bad)}.lg.u4::before{background:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 35%,transparent)}
/* simulados */
.qhead,.qrow{display:grid;grid-template-columns:38px minmax(110px,150px) auto auto minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.qhead{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.qrow{padding:6px;border-bottom:1px solid var(--line)}
.qrow.is-e{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.qrow select,.qrow input[type=text]{padding:5px 8px;font-size:.85rem}
.qn{font-weight:700;display:flex;flex-direction:column;line-height:1.1}.qn small{font-size:.65rem;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:5px 11px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.r-c{background:var(--ok);color:#08130d}.seg button.on.r-e{background:var(--bad);color:#fff}.seg button.on.r-b{background:var(--muted);color:var(--bg)}
.gch{display:inline-flex;gap:4px;align-items:center;font-size:.8rem;color:var(--muted);white-space:nowrap;cursor:pointer}
.perf .c small:first-child{font-family:var(--f-mono);color:var(--fg)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px max(10px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);z-index:20;overflow-x:auto}
  .brand{padding:0 6px 0 0}.brand b{display:none}
  .nav{display:flex;gap:2px}.nav a{padding:7px 10px;white-space:nowrap}.nav a.on{box-shadow:inset 0 -2px 0 var(--accent)}
  .nav a span.lab{font-size:.85rem}.nav .cnt{display:none}
  .sync{margin:0 0 0 auto;padding:0 6px}.sync .st{display:none}
  .g2,.g3{grid-template-columns:1fr}
  .qhead{display:none}.qrow{grid-template-columns:38px minmax(0,1fr) auto auto}.qrow input[type=text]{grid-column:1/-1}.qrow [data-ai]{grid-column:1/-1;justify-self:end}
  .gcard{grid-template-columns:auto 1fr auto}.gcard textarea:nth-of-type(2){grid-column:2/3}
}
@media (max-width:440px){.g4{grid-template-columns:1fr 1fr}.rate{grid-template-columns:repeat(2,1fr)}.big{font-size:1.4rem}}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:8px 14px;min-height:36px;margin-left:10px;font-weight:700;cursor:pointer;touch-action:manipulation}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.tbl th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.trashlist{max-height:340px;overflow:auto}
.bkst{display:flex;align-items:center;gap:8px;font-weight:600}
.item.err.done .t{text-decoration:none;color:var(--muted)}
.errnote{white-space:pre-wrap;overflow-wrap:anywhere}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.nogrow .field{flex:none}
.ttl{flex-wrap:wrap}.ttl .tabs{flex-wrap:nowrap}
/* barra inferior (celular) e alvos de toque maiores (iPad e celular) */
.nav .more{display:none}
.moregrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.moregrid a{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none;font-weight:600;background:var(--panel2);min-width:0}
.moregrid a span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moregrid a.on{border-color:var(--accent)}
.moregrid a svg{width:18px;height:18px;flex:none}
.moregrid .cnt{margin-left:auto;font-size:.75rem;background:var(--line);border-radius:20px;padding:0 7px}
.rail{height:100vh;height:100dvh}
@media (max-width:760px){
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;align-items:stretch;padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);border-bottom:0;z-index:30;overflow:visible;gap:0}
  .brand,.sync{display:none}
  .nav{display:flex;flex:1;gap:2px;justify-content:space-around}
  .nav a,.nav .more{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px;border-radius:10px;min-width:0;position:relative;color:var(--muted);background:none;border:0;cursor:pointer;font:inherit;font-weight:600}
  .nav a:not(.mob){display:none}
  .nav a span.lab,.nav .more span.lab{font-size:.68rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav a.on,.nav .more.on{box-shadow:inset 0 2px 0 var(--accent);color:var(--fg);background:var(--panel2)}
  .nav a .cnt{display:block;position:absolute;top:2px;left:calc(50% + 6px);margin:0;font-size:.62rem;padding:0 5px;background:var(--accent);color:var(--accent-ink)}
  .nav .more .dot{position:absolute;top:6px;left:calc(50% + 9px);width:7px;height:7px}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
}
@media (pointer:coarse){
  .icon-btn{min-width:40px;min-height:40px}
  .icon-btn svg{width:18px;height:18px}
  .chk{width:26px;height:26px}
  .btn{min-height:40px}.btn.sm{min-height:36px}
  .seg button{min-height:36px;min-width:42px}
  .tabs button{min-height:36px}
  .swatch{width:30px;height:30px}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{font-size:16px}
  .gch input{width:20px;height:20px}
}

  async open() {

  </div>
  <div class="grid g2">
    <div class="card"><div class="ttl"><h2>Matérias estudadas</h2><div class="tabs" id="pieR">${[[7, "7 dias"], [30, "30 dias"], [0, "Tudo"]].map(([v, l]) => `<button data-v="${v}" class="${pieRange === v ? "on" : ""}">${l}</button>`).join("")}</div></div>
      ${donut(studyBySubject(pieRange), { empty: "Use o cronômetro ou registre sessões na aba Tempo para ver a divisão por matéria.", aria: "Tempo de estudo por matéria" })}</div>
    <div class="card"><div class="ttl"><h2>Últimos 7 dias</h2><span class="sub">${fmtHM(vals.reduce((a, b) => a + b, 0))} no total</span></div>
      <div class="chart">${days.map((d, i) => `<div class="c" title="${fmtHM(vals[i])}"><small>${vals[i] ? fmtHM(vals[i]) : "&nbsp;"}</small><div class="bw"><div class="b ${i === 6 ? "today" : ""}" style="height:${vals[i] / mx * 100}%;${vals[i] >= goal ? "background:var(--ok)" : ""}"></div></div><small>${WD[(d.getDay() + 6) % 7]}</small></div>`).join("")}</div>
      <p class="sub" style="margin:8px 0 0">Barras verdes: dias em que você bateu a meta.</p></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="ttl"><h2>Hoje na agenda</h2><a class="btn sm ghost" href="#horarios">Ver semana</a></div>
      ${blocks.length ? `<div class="list">${blocks.map(b => `<div class="item"><span class="mono" style="color:var(--muted)">${esc(b.start)}–${esc(b.end)}</span><div class="grow t">${esc(b.title || b.subject)}</div>${subjPill(b.subject)}</div>`).join("")}</div>` : `<div class="empty">Nada marcado para ${WDL[todayWd()].toLowerCase()}. Monte sua rotina em Horários.</div>`}</div>
    <div class="card"><div class="ttl"><h2>Tempo gasto nas tarefas</h2><a class="btn sm ghost" href="#pendencias">Pendências</a></div>
      ${donut(taskBySubject(), { fmt: fmtShort, empty: "Toque numa pendência para começar a fazê-la. O tempo gasto aparece aqui, separado do tempo de estudo.", aria: "Tempo gasto nas tarefas por matéria" })}</div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="ttl"><h2>Pendências prioritárias</h2><a class="btn sm ghost" href="#pendencias">Todas</a></div>
      ${pend.length ? `<div class="list">${[...doing, ...sortTasks(pend.filter(t => t.status !== "doing"))].slice(0, 6).map(taskRow).join("")}</div>` : `<div class="empty">Tudo em dia.</div>`}</div>
    <div class="card"><div class="ttl"><h2>Pontos fracos</h2><a class="btn sm ghost" href="#ia">Reforçar com IA</a></div>
      ${weakList(5)}
      ${S.errors.some(e => !e.reviewed) ? `<div class="item" style="margin-top:6px;border-top:1px solid var(--line)"><div class="grow"><div class="lbl">Caderno de erros</div><div class="t">${S.errors.filter(e => !e.reviewed).length} para revisar</div></div><a class="pill" href="#erros">Abrir</a></div>` : ""}
      ${lastSim ? `<div class="item" style="margin-top:6px;border-top:1px solid var(--line)"><div class="grow"><div class="lbl">Último simulado</div><div class="t">${esc(lastSim.name)}</div></div><a class="pill" href="#simulados" data-opensim="${lastSim.id}" style="color:${pctColor(simStats(lastSim).pct * 100)}">${Math.round(simStats(lastSim).pct * 100)}%</a></div>` : ""}</div>
  </div>`;
};
BIND.painel = v => {
  bindCommon(v); bindTasks(v);
  v.querySelectorAll("#pieR button").forEach(b => b.onclick = () => { pieRange = +b.dataset.v; render(); });
  $("#editGoal").onclick = editGoal;
  v.querySelectorAll("[data-opensim]").forEach(a => a.onclick = () => { const s = SIMS[a.dataset.opensim]; if (s) { simFolder = s.folder; simOpen = s.id; } });
};
function editGoal() {
  const g = S.settings.goalMin;
  modal(`<h2>Meta diária de estudo</h2>
  <p class="sub" style="margin:0">A meta é quanto tempo você quer estudar por dia. Contam o cronômetro e as sessões registradas manualmente na aba Tempo (o tempo das pendências fica separado). A barra do painel enche conforme você estuda e fica verde quando você bate a meta. Em Estatísticas, você vê em quantos dias bateu a meta.</p>
  <div class="row"><label class="field"><span>Horas</span><input type="number" id="gH" min="0" max="16" value="${Math.floor(g / 60)}"></label><label class="field"><span>Minutos</span><input type="number" id="gM" min="0" max="59" step="5" value="${g % 60}"></label></div>
  <div class="row end"><button class="btn ghost" data-x>Cancelar</button><button class="btn pri" data-ok>Salvar meta</button></div>`, (m, close) => {
    m.querySelector("[data-x]").onclick = close;
    m.querySelector("[data-ok]").onclick = () => { const v = (+m.querySelector("#gH").value || 0) * 60 + (+m.querySelector("#gM").value || 0); if (v < 10) return toast("A meta precisa ter pelo menos 10 minutos"); S.settings.goalMin = Math.min(960, v); commit("settings"); close(); render(); toast("Meta atualizada"); };
  });
}
function greet() { const h = new Date().getHours(); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; }
function weakList(n) {
  const w = liveCards().filter(c => c.bad + c.lapses > 0).sort((a, b) => weakness(b) - weakness(a)).slice(0, n);
  if (!w.length) return `<div class="empty">Os cartões que você mais erra aparecem aqui.</div>`;
  return `<div class="list">${w.map(c => `<div class="item"><div class="grow t">${esc(c.front.slice(0, 110))}</div><span class="pill" style="color:var(--bad)">${c.bad} erro${c.bad !== 1 ? "s" : ""}</span></div>`).join("")}</div>`;
}
function bindCommon(v) { v.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go)); }

/* ---- Pendências ---- */
let taskSubj = "";
const taskSec = t => (t.work || 0) + (t.runStart ? Math.max(0, Date.now() - t.runStart) / 1000 : 0);
function sortTasks(a) { const P = { alta: 0, media: 1, baixa: 2 }; return [...a].sort((x, y) => ((x.due || "9999").localeCompare(y.due || "9999")) || (P[x.prio] ?? 1) - (P[y.prio] ?? 1)); }
function pauseOthers(t) { S.tasks.forEach(o => { if (o !== t && o.runStart) { o.work = taskSec(o); o.runStart = 0; } }); }
function setTaskStatus(t, st) {
  const now = Date.now();
  if (t.runStart) { t.work = taskSec(t); t.runStart = 0; }
  if (st === "doing") { pauseOthers(t); t.runStart = now; t.startedAt = t.startedAt || now; }
  t.status = st; t.done = st === "done"; t.doneAt = st === "done" ? now : null;
  commit("tasks");
}
function taskRow(t) {
  const st = t.status || "todo";
  const dd = t.due ? daysUntil(t.due) : null;
  const due = t.due ? `<span class="pill ${st !== "done" && dd < 0 ? "late" : ""}">${dd === 0 ? "hoje" : dd === 1 ? "amanhã" : fmtDate(t.due)}</span>` : "";
  const sec = taskSec(t);
  const time = st !== "todo" || sec > 0 ? `<span class="pill tt ${t.runStart ? "run" : ""}" data-tt="${t.id}" title="Tempo gasto">${fmtClock(sec)}</span>` : "";
  const tip = st === "todo" ? "Começar a fazer" : st === "doing" ? "Concluir" : "Voltar para pendentes";
  return `<div class="item ${st === "done" ? "done" : ""}" data-task="${t.id}"><button class="chk ${st === "done" ? "on" : st === "doing" ? "doing" : ""}" data-act="toggle" aria-label="${tip}" title="${tip}"></button>
  <div class="grow"><div class="t">${esc(t.text)}</div>${t.note ? `<div class="sub" style="overflow-wrap:anywhere">${esc(t.note)}</div>` : ""}</div>
  <div class="row" style="gap:5px;justify-content:flex-end">${subjPill(t.subject)}<span class="pill ${t.prio}">${{ alta: "alta", media: "média", baixa: "baixa" }[t.prio] || "média"}</span>${due}${time}
  ${st === "doing" ? `<button class="btn sm" data-act="pause">${t.runStart ? "Pausar" : "Retomar"}</button>` : ""}
  <button class="icon-btn" data-act="edit" aria-label="Editar">${ico("edit")}</button><button class="icon-btn" data-act="del" aria-label="Excluir">${ico("trash")}</button></div></div>`;
}
VIEWS.pendencias = () => {
  const f = t => !taskSubj || t.subject === taskSubj;
  const doing = S.tasks.filter(t => t.status === "doing" && f(t));
  const todo = sortTasks(S.tasks.filter(t => t.status === "todo" && f(t)));
  const done = S.tasks.filter(t => t.status === "done" && f(t)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const sect = (title, list, extra, empty, cls = "") => `<div class="card ${cls}"><div class="ttl"><h2>${title} <span class="sub" style="font-family:var(--f-body)">${list.length}</span></h2>${extra || ""}</div>${list.length ? `<div class="list">${list.map(taskRow).join("")}</div>` : `<div class="empty">${empty}</div>`}</div>`;
  const doneSec = done.reduce((a, t) => a + taskSec(t), 0);
  return `<div class="head"><div><h1>Pendências</h1><p>${S.tasks.filter(t => t.status !== "done").length} a fazer · ${doing.length} realizando · ${S.tasks.filter(t => t.status === "done").length} concluídas</p></div>
  <select id="tFiltSubj" style="width:auto" aria-label="Filtrar por matéria"><option value="">Todas as matérias</option>${subjects().map(s => `<option ${s.name === taskSubj ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
  <div data-form class="card" id="taskForm"><div class="row" style="align-items:flex-end">
    <label class="field" style="flex:3 1 240px"><span>Nova pendência</span><input type="text" id="tText" name="text" placeholder="Ex.: Lista de exercícios de estequiometria" required></label>
    <label class="field" style="flex:1 1 130px"><span>Matéria</span><select id="tSubj" name="subject">${subjOptions(taskSubj)}</select></label>
    <label class="field" style="flex:1 1 110px"><span>Prioridade</span><select id="tPrio" name="prio"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select></label>
    <label class="field" style="flex:1 1 140px"><span>Prazo</span><input type="date" id="tDue" name="due"></label>
    <button class="btn pri" type="button" data-submit>${ico("plus")}Adicionar</button></div>
    <p class="sub" style="margin:10px 0 0">Toque no quadrado de uma tarefa para começar: ela vai para <b>Realizando</b> e o tempo começa a contar. Toque de novo para concluir. O tempo gasto fica registrado na tarefa.</p></div>
  ${sect("Realizando", doing, doing.length ? `<span class="sub">só uma tarefa conta tempo por vez</span>` : "", "Nenhuma tarefa em andamento. Toque no quadrado de uma pendência para começar.", doing.length ? "card-doing" : "")}
  ${sect("Pendentes", todo, "", "Nenhuma pendência aqui.")}
  ${sect("Concluídas", done, done.length ? `<div class="row"><span class="sub">${fmtShort(doneSec)} gastos</span><button class="btn sm ghost danger" id="clearDone">Limpar concluídas</button></div>` : "", "As tarefas concluídas aparecem aqui com o tempo gasto.")}
  <div class="card"><div class="ttl"><h2>Tempo gasto nas tarefas por matéria</h2></div>${donut(taskBySubject(), { fmt: fmtShort, empty: "Comece uma tarefa para medir o tempo gasto.", aria: "Tempo gasto nas tarefas por matéria" })}
  <p class="sub" style="margin:10px 0 0">Este tempo é separado do tempo de estudo do cronômetro.</p></div>`;
};
BIND.pendencias = v => {
  bindTasks(v);
  $("#taskForm").onsubmit = e => { e.preventDefault(); const f = formData(e.target); if (!f.text.trim()) return; S.tasks.push({ id: uid(), text: f.text.trim(), subject: f.subject, prio: f.prio, due: f.due, status: "todo", done: false, work: 0, createdAt: Date.now() }); commit("tasks"); render(); $("#tText").focus(); };
  $("#tFiltSubj").onchange = e => { taskSubj = e.target.value; render(); };
  const cd = $("#clearDone"); if (cd) cd.onclick = () => confirmBox("Excluir todas as pendências concluídas? O tempo gasto nelas também sai do gráfico.", "Excluir", () => { const gone = S.tasks.filter(t => t.status === "done"); const e = gone.length ? trashAdd("tasks", `${gone.length} pendência${gone.length > 1 ? "s" : ""} concluída${gone.length > 1 ? "s" : ""}`, gone.map(trashTaskCopy)) : null; S.tasks = S.tasks.filter(t => t.status !== "done"); commit("tasks"); render(); if (e) afterDelete("Pendências excluídas", e); });
};
function bindTasks(v) {
  v.querySelectorAll("[data-task]").forEach(row => {
    const t = S.tasks.find(x => x.id === row.dataset.task); if (!t) return;
    row.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === "toggle") {
        const nx = { todo: "doing", doing: "done", done: "todo" }[t.status || "todo"];
        setTaskStatus(t, nx);
        toast(nx === "doing" ? "Em andamento: o tempo está contando" : nx === "done" ? `Concluída em ${fmtShort(taskSec(t))}` : "Voltou para pendentes");
        render();
      }
      if (a === "pause") { if (t.runStart) { t.work = taskSec(t); t.runStart = 0; } else { pauseOthers(t); t.runStart = Date.now(); } commit("tasks"); render(); }
      if (a === "del") confirmBox(`Excluir "${t.text}"?`, "Excluir", () => { const e = trashAdd("task", t.text, trashTaskCopy(t)); S.tasks = S.tasks.filter(x => x !== t); commit("tasks"); render(); afterDelete("Pendência excluída", e); });
      if (a === "edit") editTask(t);
    });
  });
}
function editTask(t) {
  modal(`<h2>Editar pendência</h2><label class="field"><span>Descrição</span><input type="text" name="text" id="eText" value="${esc(t.text)}"></label>
  <label class="field"><span>Observação</span><textarea name="note" id="eNote" maxlength="2000">${esc(t.note || "")}</textarea></label>
  <div class="row"><label class="field"><span>Matéria</span><select name="subject" id="eSubj">${subjOptions(t.subject)}</select></label>
  <label class="field"><span>Prioridade</span><select name="prio" id="ePrio">${["alta", "media", "baixa"].map(p => `<option value="${p}" ${t.prio === p ? "selected" : ""}>${{ alta: "Alta", media: "Média", baixa: "Baixa" }[p]}</option>`).join("")}</select></label>
  <label class="field"><span>Prazo</span><input type="date" name="due" id="eDue" value="${esc(t.due || "")}"></label></div>
  <div class="row"><label class="field"><span>Tempo gasto (minutos)</span><input type="number" name="workMin" id="eWork" min="0" value="${Math.round(taskSec(t) / 60)}"></label></div>
  <div class="row end"><button class="btn ghost" data-x>Cancelar</button><button class="btn pri" data-ok>Salvar</button></div>`, (m, close) => {
    m.querySelector("[data-x]").onclick = close;
    m.querySelector("[data-ok]").onclick = () => {
      const f = formData(m); const wm = Math.max(0, +f.workMin || 0); delete f.workMin;
      Object.assign(t, f); t.text = t.text.trim() || "(sem título)";
      if (Math.round(taskSec(t) / 60) !== wm) { t.work = wm * 60; if (t.runStart) t.runStart = Date.now(); }
      commit("tasks"); close(); render();
    };
  });
}

/* ---- Tempo ---- */
VIEWS.tempo = () => {
  const t = S.timer; const k = dkey();
  const todaySes = S.sessions.filter(s => s.date === k);
  const recent = [...S.sessions].sort((a, b) => b.start - a.start).slice(0, 25);
  const bySubj = {}; S.sessions.filter(s => daysUntil(s.date) > -7).forEach(s => bySubj[s.subject] = (bySubj[s.subject] || 0) + s.dur);
  const mx = Math.max(1, ...Object.values(bySubj));
  return `<div class="head"><div><h1>Tempo de estudo</h1><p>Hoje: <b id="todayTotal">${fmtHM(secsOnDay(k))}</b> de ${fmtHM(S.settings.goalMin * 60)} · ${todaySes.length} sessões</p></div></div>
  <div class="grid g2">
  <div class="card"><div class="ttl"><h2>Cronômetro</h2><div class="tabs" id="tmode"><button data-m="livre" class="${t.mode === "livre" ? "on" : ""}">Livre</button><button data-m="pomodoro" class="${t.mode === "pomodoro" ? "on" : ""}">Pomodoro</button></div></div>
    <div class="row"><label class="field"><span>Matéria</span><select id="tmSubj" ${t.running ? "disabled" : ""}>${subjOptions(t.subject)}</select></label>
    ${t.mode === "pomodoro" ? `<label class="field" style="max-width:120px"><span>Minutos</span><input type="number" id="pomoMin" min="1" max="180" value="${t.pomoMin}" ${t.running || t.acc ? "disabled" : ""}></label>` : ""}</div>
    <div class="timer" id="clock">00:00:00</div>
    <div class="row" style="justify-content:center">
      ${t.running ? `<button class="btn" id="tPause">Pausar</button>` : `<button class="btn pri" id="tStart">${t.acc ? "Continuar" : "Iniciar"}</button>`}
      <button class="btn" id="tStop" ${!t.running && !t.acc ? "disabled" : ""}>Encerrar e salvar</button>
      <button class="btn ghost danger" id="tReset" ${!t.running && !t.acc ? "disabled" : ""}>Descartar</button></div>
    <p class="sub" style="text-align:center;margin:10px 0 0">O cronômetro continua contando mesmo se você fechar a página.</p></div>
  <div data-form class="card" id="manForm"><h2>Registrar manualmente</h2>
    <div class="row"><label class="field"><span>Matéria</span><select name="subject" id="mSubj">${subjOptions("")}</select></label>
    <label class="field"><span>Data</span><input type="date" name="date" id="mDate" value="${k}"></label></div>
    <div class="row"><label class="field"><span>Horas</span><input type="number" name="h" id="mH" min="0" max="23" value="0"></label><label class="field"><span>Minutos</span><input type="number" name="m" id="mM" min="0" max="59" value="30"></label></div>
    <div class="row end" style="margin-top:10px"><button class="btn pri" type="button" data-submit>Adicionar sessão</button></div>
    <div class="ttl" style="margin-top:14px"><h3>Últimos 7 dias por matéria</h3></div>
    ${Object.keys(bySubj).length ? Object.entries(bySubj).sort((a, b) => b[1] - a[1]).map(([n, v]) => `<div class="hbar"><span class="n">${esc(n)}</span><div class="bar"><div style="width:${v / mx * 100}%;background:${esc(subjColor(n))}"></div></div><span class="v">${fmtHM(v)}</span></div>`).join("") : `<div class="empty">Sem sessões nesta semana.</div>`}
  </div></div>
  <div class="card"><div class="ttl"><h2>Histórico</h2><span class="sub">${S.sessions.length} sessões · ${fmtHM(S.sessions.reduce((a, s) => a + s.dur, 0))} no total</span></div>
  ${recent.length ? `<div class="list">${recent.map(s => `<div class="item" data-ses="${s.id}"><span class="mono" style="color:var(--muted);min-width:56px">${fmtDate(s.date)}</span><div class="grow">${subjPill(s.subject)}</div><span class="mono">${fmtHM(s.dur)}</span><button class="icon-btn" data-act="del" aria-label="Excluir">${ico("trash")}</button></div>`).join("")}</div>` : `<div class="empty">Suas sessões aparecem aqui.</div>`}</div>`;
};
BIND.tempo = v => {
  const t = S.timer;
  v.querySelectorAll("#tmode button").forEach(b => b.onclick = () => { if (t.running || t.acc) return toast("Encerre o cronômetro atual antes de trocar o modo"); t.mode = b.dataset.m; commit("timer"); render(); });
  const sel = $("#tmSubj"); sel.onchange = () => { t.subject = sel.value; commit("timer"); };
  const pm = $("#pomoMin"); if (pm) pm.onchange = () => { t.pomoMin = Math.max(1, Math.min(180, +pm.value || 25)); commit("timer"); };
  const st = $("#tStart"); if (st) st.onclick = () => { startTimer(sel.value); render(); };
  const pa = $("#tPause"); if (pa) pa.onclick = () => { pauseTimer(); render(); };
  $("#tStop").onclick = () => { stopTimer(true); render(); };
  $("#tReset").onclick = () => confirmBox("Descartar o tempo atual sem salvar?", "Descartar", () => { stopTimer(false); render(); });
  $("#manForm").onsubmit = e => { e.preventDefault(); const f = formData(e.target); const dur = (+f.h || 0) * 3600 + (+f.m || 0) * 60; if (dur <= 0) return toast("Informe a duração"); S.sessions.push({ id: uid(), subject: f.subject || "Geral", date: f.date || dkey(), start: parseDay(f.date || dkey()).getTime() + 12 * 3600000, dur }); commit("sessions"); toast("Sessão adicionada"); render(); };
  v.querySelectorAll("[data-ses]").forEach(r => r.querySelector("[data-act]").onclick = () => confirmBox("Excluir esta sessão?", "Excluir", () => { const ses = S.sessions.find(s => s.id === r.dataset.ses); const e = ses ? trashAdd("session", `${ses.subject || "Geral"} · ${fmtShort(ses.dur)} em ${fmtDate(ses.date)}`, ses) : null; S.sessions = S.sessions.filter(s => s.id !== r.dataset.ses); commit("sessions"); render(); if (e) afterDelete("Sessão excluída", e); }));
  paintClock();
};

/* ---- Provas ---- */
const urg = d => d < 0 ? "past" : d <= 3 ? "u4" : d <= 14 ? "u3" : d <= 30 ? "u2" : d <= 60 ? "u1" : "u0";
VIEWS.provas = () => {
  const up = S.exams.filter(e => daysUntil(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
  const past = S.exams.filter(e => daysUntil(e.date) < 0).sort((a, b) => b.date.localeCompare(a.date));
  const ex = e => {
    const d = daysUntil(e.date); const u = urg(d); const tk = e.tasks || [];
    const pend = tk.filter(t => !t.done).length;
    const sorted = [...tk.filter(t => !t.done), ...tk.filter(t => t.done)];

    <div class="countdown urg-${u}">${d === 0 ? "É hoje" : d > 0 ? `${d} dia${d > 1 ? "s" : ""}` : `há ${-d} dias`}</div>
    ${d > 6 ? `<div class="sub">${Math.floor(d / 7)} semana${Math.floor(d / 7) > 1 ? "s" : ""}${d % 7 ? ` e ${d % 7} dia${d % 7 > 1 ? "s" : ""}` : ""}</div>` : ""}${e.note ? `<p class="sub" style="overflow-wrap:anywhere;margin:6px 0 0">${esc(e.note)}</p>` : ""}

      ${tk.length && pend === 0 ? `<div class="sub" style="color:var(--ok)">Tudo pronto para esta prova.</div>` : ""}
      ${sorted.map(t => `<div class="etask ${t.done ? "ok" : u}" data-et="${t.id}"><button class="chk ${t.done ? "on" : ""}" data-eact="toggle" aria-label="${t.done ? "Desmarcar" : "Marcar como feita"}"></button><span class="t">${esc(t.text)}</span>${t.subject ? subjPill(t.subject) : ""}<button class="icon-btn" data-eact="del" aria-label="Excluir tarefa">${ico("trash")}</button></div>`).join("")}
      ${d >= 0 ? `<div data-form class="row" data-etform style="flex-wrap:nowrap"><input type="text" id="et-${e.id}" placeholder="Ex.: Resolver provas antigas" aria-label="Nova tarefa até ${esc(e.name)}" style="flex:1"><button class="btn sm pri" type="button" data-submit>${ico("plus")}Tarefa</button></div>` : ""}
    </div></div>`;
  };
  return `<div class="head"><div><h1>Provas e contagem regressiva</h1><p>${up.length} próximas · cada prova tem a própria lista de tarefas, separada das pendências do dia a dia</p></div></div>
  <div data-form class="card" id="exForm"><div class="row" style="align-items:flex-end"><label class="field" style="flex:2 1 220px"><span>Prova ou evento</span><input type="text" name="name" id="exName" placeholder="Ex.: Fuvest — 1ª fase" required></label>
  <label class="field" style="flex:1 1 150px"><span>Data</span><input type="date" name="date" id="exDate" required></label><label class="field" style="flex:2 1 200px"><span>Observação</span><input type="text" name="note" id="exNote" placeholder="Local, conteúdo…"></label><button class="btn pri" type="button" data-submit>${ico("plus")}Adicionar</button></div></div>
  ${up.length ? `<div class="row sub legend-row">Cor das tarefas não feitas conforme a prova chega: <span class="lg u0">mais de 60 dias</span><span class="lg u1">até 60</span><span class="lg u2">até 30</span><span class="lg u3">até 14</span><span class="lg u4">últimos 3 dias</span></div><div class="grid g2">${up.map(ex).join("")}</div>` : `<div class="card empty">Cadastre suas provas para ver a contagem regressiva e criar tarefas até o dia do vestibular.</div>`}
  ${past.length ? `<h2>Já realizadas</h2><div class="grid g2">${past.map(ex).join("")}</div>` : ""}`;
};
BIND.provas = v => {
  $("#exForm").onsubmit = e => { e.preventDefault(); const f = formData(e.target); if (!f.name.trim() || !f.date) return; S.exams.push({ id: uid(), name: f.name.trim(), date: f.date, note: f.note, tasks: [] }); commit("exams"); render(); };
  v.querySelectorAll("[data-exam]").forEach(c => {

      if (b.dataset.act === "del") confirmBox(`Excluir "${ex.name}" e suas tarefas?`, "Excluir", () => { const e = trashAdd("exam", ex.name, ex); S.exams = S.exams.filter(x => x !== ex); commit("exams"); render(); afterDelete("Prova excluída", e); });
      else modal(`<h2>Editar prova</h2><label class="field"><span>Nome</span><input type="text" name="name" id="eeName" value="${esc(ex.name)}"></label><label class="field"><span>Data</span><input type="date" name="date" id="eeDate" value="${esc(ex.date)}"></label><label class="field"><span>Observação</span><input type="text" name="note" id="eeNote" value="${esc(ex.note || "")}"></label><div class="row end"><button class="btn ghost" data-x>Cancelar</button><button class="btn pri" data-ok>Salvar</button></div>`,
        (m, close) => { m.querySelector("[data-x]").onclick = close; m.querySelector("[data-ok]").onclick = () => { const f = formData(m); if (!f.date) return; Object.assign(ex, f); commit("exams"); close(); render(); }; });
    });
    c.querySelectorAll("[data-et]").forEach(r => { const t = ex.tasks.find(x => x.id === r.dataset.et); r.querySelectorAll("[data-eact]").forEach(b => b.onclick = () => {
      let gone = null;
      if (b.dataset.eact === "toggle") { t.done = !t.done; t.doneAt = t.done ? Date.now() : null; } else { gone = trashAdd("etask", t.text, { exam: ex.id, task: t }); ex.tasks = ex.tasks.filter(x => x !== t); }
      commit("exams"); render(); if (gone) afterDelete("Tarefa excluída", gone);
    }); });
    const fm = c.querySelector("[data-etform]"); if (fm) fm.onsubmit = e => { e.preventDefault(); const inp = fm.querySelector("input"); const txt = inp.value.trim(); if (!txt) return; ex.tasks.push({ id: uid(), text: txt, done: false, createdAt: Date.now() }); commit("exams"); render(); const n = $("#et-" + ex.id); if (n) n.focus(); };
  });
};

/* ---- Horários ---- */

  return `<div class="head"><div><h1>Horários da semana</h1><p>${S.agenda.length} blocos · ${fmtHM(total * 60)} planejadas por semana</p></div>

    return `<div class="day ${d === tw ? "today" : ""}"><h3>${n}<button class="icon-btn" data-add="${d}" aria-label="Adicionar em ${n}">${ico("plus")}</button></h3>${bl.map(b => `<div class="blk" data-blk="${b.id}" style="--c:${esc(subjColor(b.subject))}"><span>${esc(b.start)}–${esc(b.end)}</span><b>${esc(b.title || b.subject || "Bloco")}</b>${b.title && b.subject ? `<span style="font-family:var(--f-body)">${esc(b.subject)}</span>` : ""}</div>`).join("") || `<div class="sub">livre</div>`}</div>`; }).join("")}</div>`;
};
BIND.horarios = v => {
  $("#addBlk").onclick = () => editBlock({ day: todayWd() });
  v.querySelectorAll("[data-add]").forEach(b => b.onclick = () => editBlock({ day: +b.dataset.add }));
  v.querySelectorAll("[data-blk]").forEach(b => b.onclick = () => editBlock(S.agenda.find(x => x.id === b.dataset.blk)));

};
function editBlock(b) {

  modal(`<h2>${isNew ? "Novo bloco" : "Editar bloco"}</h2>
  <label class="field"><span>Atividade</span><input type="text" name="title" id="bTitle" value="${esc(b.title || "")}" placeholder="Ex.: Revisão de Biologia"></label>
  <div class="row"><label class="field"><span>Dia</span><select name="day" id="bDay">${WDL.map((n, i) => `<option value="${i}" ${b.day === i ? "selected" : ""}>${n}</option>`).join("")}</select></label>
  <label class="field"><span>Matéria</span><select name="subject" id="bSubj">${subjOptions(b.subject)}</select></label></div>
  <div class="row"><label class="field"><span>Início</span><input type="time" name="start" id="bStart" value="${esc(b.start || "08:00")}"></label><label class="field"><span>Fim</span><input type="time" name="end" id="bEnd" value="${esc(b.end || "09:00")}"></label></div>
  ${isNew ? `<label class="row" style="gap:6px"><input type="checkbox" name="rep" id="bRep"> Repetir de segunda a sexta</label>` : ""}
  <div class="row end">${isNew ? "" : `<button class="btn ghost danger" data-del style="margin-right:auto">Excluir</button>`}<button class="btn ghost" data-x>Cancelar</button><button class="btn pri" data-ok>Salvar</button></div>`, (m, close) => {
    m.querySelector("[data-x]").onclick = close;
    const del = m.querySelector("[data-del]"); if (del) del.onclick = () => { const e = trashAdd("block", `${b.title || b.subject || "Bloco"} · ${WDL[b.day]} ${b.start}`, b); S.agenda = S.agenda.filter(x => x !== b); commit("agenda"); close(); render(); afterDelete("Bloco excluído", e); };
    m.querySelector("[data-ok]").onclick = () => {

      if (isNew) (f.rep ? [0, 1, 2, 3, 4] : [+f.day]).forEach(d => S.agenda.push({ id: uid(), day: d, ...base }));
      else Object.assign(b, base, { day: +f.day });
      commit("agenda"); close(); render();

}

/* ---- Flashcards ---- */
let studyState = null, fcDeck = null, fcSearch = "";
VIEWS.flashcards = () => {
  if (studyState) return studyView();
  if (fcDeck) return deckView();
  const decks = S.decks;
  return `<div class="head"><div><h1>Flashcards</h1><p>${liveCards().length} cartões · ${dueCards().length} para revisar · ${newCards().length} novos</p></div>
  <div class="row"><button class="btn" data-go="ia">${ico("ia")}Criar com IA</button><button class="btn" id="impFc">Importar planilha</button><button class="btn" id="newDeck">${ico("plus")}Novo baralho</button><button class="btn pri" id="studyAll" ${dueCards().length + newCards().length ? "" : "disabled"}>Estudar tudo</button></div></div>
  ${decks.length ? `<div class="grid g3">${decks.map(d => { const c = deckCards(d.id); const due = dueCards(d.id).length, nw = newCards(d.id).length; const acc = c.reduce((a, x) => a + x.ok, 0), tot = c.reduce((a, x) => a + x.ok + x.bad, 0);
    return `<div class="card deck" data-deck="${d.id}"><div class="ttl" style="margin:0"><h2 style="overflow-wrap:anywhere">${esc(d.name)}</h2>${subjPill(d.subject)}</div>
    <div class="nums"><span class="n-due">${due} revisar</span><span class="n-new">${nw} novos</span><span class="sub">${c.length} total</span></div>
    <div class="sub">${tot ? `Acertos: ${Math.round(acc / tot * 100)}%` : "Ainda não estudado"}</div>
    <div class="row"><button class="btn pri sm" data-act="study" ${due + nw ? "" : "disabled"}>Estudar</button><button class="btn sm" data-act="open">Cartões</button><button class="btn sm ghost" data-act="add">${ico("plus")}Cartão</button></div></div>`; }).join("")}</div>`
    : `<div class="card"><div class="empty"><p><b>Nenhum baralho ainda.</b></p><p>Crie um baralho e adicione cartões manualmente, cole uma lista, ou peça para a Memora IA gerar a partir de um tema, fotos ou PDFs.</p><div class="row" style="justify-content:center"><button class="btn" id="newDeck2">Criar baralho</button><button class="btn pri" data-go="ia">Gerar com IA</button></div></div></div>`}
  <div class="card"><div class="ttl"><h2>Cartões que você mais erra</h2></div>${weakList(8)}</div>`;
};
BIND.flashcards = v => {
  bindCommon(v);
  if (studyState) return bindStudy(v);
  if (fcDeck) return bindDeck(v);
  [$("#newDeck"), $("#newDeck2")].forEach(b => b && (b.onclick = () => editDeck()));
  const ifc = $("#impFc"); if (ifc) ifc.onclick = () => openImport();
  const sa = $("#studyAll"); if (sa) sa.onclick = () => startStudy(null);
  v.querySelectorAll("[data-deck]").forEach(c => c.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const id = c.dataset.deck; if (b.dataset.act === "study") startStudy(id); else if (b.dataset.act === "open") { fcDeck = id; render(); } else editCard({ deck: id });
  }));
};
function editDeck(d, after) {
  const isNew = !d; d = d || {};
  modal(`<h2>${isNew ? "Novo baralho" : "Editar baralho"}</h2><label class="field"><span>Nome</span><input type="text" name="name" id="dName" value="${esc(d.name || "")}" placeholder="Ex.: Química — Equilíbrio iônico"></label>
  <label class="field"><span>Matéria</span><select name="subject" id="dSubj">${subjOptions(d.subject)}</select></label>
  <div class="row end"><button class="btn ghost" data-x>Cancelar</button><button class="btn pri" data-ok>Salvar</button></div>`, (m, close) => {
    m.querySelector("[data-x]").onclick = close;
    m.querySelector("[data-ok]").onclick = () => { const f = formData(m); if (!f.name.trim()) return toast("Dê um nome ao baralho");
      if (isNew) { d = { id: uid(), name: f.name.trim(), subject: f.subject, createdAt: Date.now() }; S.decks.push(d); } else Object.assign(d, { name: f.name.trim(), subject: f.subject });
      commit("decks"); close(); after ? after(d) : render(); };
  });
}
function deckView() {
  const d = S.decks.find(x => x.id === fcDeck); if (!d) { fcDeck = null; return VIEWS.flashcards(); }
  const q = fcSearch.toLowerCase();
  const cs = deckCards(d.id).filter(c => !q || (c.front + " " + c.back + " " + (c.tags || []).join(" ")).toLowerCase().includes(q)).sort((a, b) => b.createdAt - a.createdAt);
  return `<div class="head"><div><button class="btn sm ghost" id="back">← Baralhos</button><h1 style="margin-top:8px">${esc(d.name)}</h1><p>${deckCards(d.id).length} cartões · ${dueCards(d.id).length} para revisar · ${newCards(d.id).length} novos</p></div>
  <div class="row"><button class="btn" id="editD">Renomear</button><button class="btn" id="bulk">Colar em lote</button><button class="btn" id="impDk">Importar planilha</button><button class="btn" data-go="ia">${ico("ia")}IA</button><button class="btn pri" id="addC">${ico("plus")}Cartão</button></div></div>
  <div class="card"><div class="ttl"><input type="search" id="fcSearch" placeholder="Buscar nos cartões" value="${esc(fcSearch)}" style="max-width:320px"><button class="btn sm ghost danger" id="delD">Excluir baralho</button></div>
  ${cs.length ? `<div class="list">${cs.map(c => `<div class="item" data-card="${c.id}"><div class="grow"><div class="t" style="font-weight:600">${esc(c.front)}</div><div class="sub t">${esc(c.back.slice(0, 220))}</div></div>
    <div class="row" style="gap:5px;flex:none">${c.reps === 0 && !c.lapses ? `<span class="pill n-new">novo</span>` : c.due <= Date.now() ? `<span class="pill n-due">hoje</span>` : `<span class="pill">${fmtDate(dkey(new Date(c.due)))}</span>`}${c.bad ? `<span class="pill" style="color:var(--bad)">${c.bad}✕</span>` : ""}
    <button class="icon-btn" data-act="edit" aria-label="Editar">${ico("edit")}</button><button class="icon-btn" data-act="del" aria-label="Excluir">${ico("trash")}</button></div></div>`).join("")}</div>` : `<div class="empty">${q ? "Nenhum cartão encontrado." : "Baralho vazio. Adicione cartões ou gere com a IA."}</div>`}</div>`;
}
function bindDeck(v) {
  const d = S.decks.find(x => x.id === fcDeck);
  $("#back").onclick = () => { fcDeck = null; fcSearch = ""; render(); };
  $("#editD").onclick = () => editDeck(d);
  $("#addC").onclick = () => editCard({ deck: d.id });
  $("#bulk").onclick = () => bulkImport(d);
  $("#impDk").onclick = () => openImport(d.id);
  const s = $("#fcSearch"); s.oninput = () => { fcSearch = s.value; const pos = s.selectionStart; render(); const n = $("#fcSearch"); n.focus(); n.setSelectionRange(pos, pos); };
  $("#delD").onclick = () => confirmBox(`Excluir o baralho "${d.name}" e seus ${deckCards(d.id).length} cartões?`, "Excluir", () => { const ids = deckCards(d.id).map(c => c.id); const e = trashAdd("deck", `${d.name} (${ids.length} cartões)`, { deck: d, cards: ids }); deckCards(d.id).forEach(c => { c.deleted = true; commitCard(c); }); S.decks = S.decks.filter(x => x !== d); fcDeck = null; commit("decks"); render(); afterDelete("Baralho excluído", e); });
  v.querySelectorAll("[data-card]").forEach(r => { const c = CARDS[r.dataset.card]; r.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    if (b.dataset.act === "edit") editCard(c); else confirmBox("Excluir este cartão?", "Excluir", () => { const e = trashAdd("card", c.front.slice(0, 90), { id: c.id }); c.deleted = true; commitCard(c); render(); afterDelete("Cartão excluído", e); });
  }); });
}
function editCard(c) {
  const isNew = !c.id;
  modal(`<h2>${isNew ? "Novo cartão" : "Editar cartão"}</h2>
  <label class="field"><span>Baralho</span><select name="deck" id="cDeck">${S.decks.map(d => `<option value="${d.id}" ${d.id === c.deck ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></label>
  <label class="field"><span>Frente (pergunta)</span><textarea name="front" id="cFront">${esc(c.front || "")}</textarea></label>
  <label class="field"><span>Verso (resposta)</span><textarea name="back" id="cBack">${esc(c.back || "")}</textarea></label>
  <label class="field"><span>Etiquetas (separe por vírgula)</span><input type="text" name="tags" id="cTags" value="${esc((c.tags || []).join(", "))}"></label>
  <div class="row end">${isNew ? `<span class="sub" style="margin-right:auto">Ctrl+Enter salva e abre outro</span>` : ""}<button class="btn ghost" data-x>Fechar</button><button class="btn pri" data-ok>Salvar</button></div>`, (m, close) => {
    m.querySelector("[data-x]").onclick = close;
    const save = again => { const f = formData(m); if (!f.front.trim() || !f.back.trim()) return toast("Preencha frente e verso");
      const tags = f.tags.split(",").map(x => x.trim()).filter(Boolean);
      if (isNew) commitCard(newCard(f.deck, f.front.trim(), f.back.trim(), tags)); else { Object.assign(c, { deck: f.deck, front: f.front.trim(), back: f.back.trim(), tags }); commitCard(c); }
      if (again && isNew) { m.querySelector("#cFront").value = ""; m.querySelector("#cBack").value = ""; m.querySelector("#cFront").focus(); toast("Cartão salvo"); render(); } else { close(); render(); } };
    m.querySelector("[data-ok]").onclick = () => save(false);
    m.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) save(true); });
  });
}
function bulkImport(d) {
  modal(`<h2>Colar cartões em lote</h2><p class="sub">Um cartão por linha, com frente e verso separados por <code>;</code> ou tabulação (formato aceito pelo Anki também).</p>
  <textarea id="bulkTxt" style="min-height:180px" placeholder="Fórmula da água; H₂O&#10;Kw a 25 °C; 1,0 × 10⁻¹⁴"></textarea>
  <div class="row end"><button class="btn ghost" data-x>Cancelar</button><button class="btn pri" data-ok>Importar</button></div>`, (m, close) => {
    m.querySelector("[data-x]").onclick = close;
    m.querySelector("[data-ok]").onclick = () => { let n = 0; m.querySelector("#bulkTxt").value.split(/\r?\n/).forEach(l => { const p = l.split(/\t|;/); if (p.length >= 2 && p[0].trim() && p[1].trim()) { commitCard(newCard(d.id, p[0].trim(), p.slice(1).join(";").trim())); n++; } }); close(); toast(`${n} cartões importados`); render(); };
  });
}
function startStudy(deck, only) {
  const due = dueCards(deck).sort((a, b) => a.due - b.due);
  const nw = newCards(deck).sort((a, b) => a.createdAt - b.createdAt).slice(0, 30);
  const queue = only ? only.filter(id => CARDS[id] && !CARDS[id].deleted) : [...due, ...nw].map(c => c.id);
  if (!queue.length) return toast("Nada para revisar agora");
  studyState = { deck, queue, i: 0, shown: false, done: 0, ok: 0, explain: "", failed: [] };
  if (route !== "flashcards") go("flashcards"); else render();
}
function studyView() {
  const st = studyState;
  while (st.i < st.queue.length && (!CARDS[st.queue[st.i]] || CARDS[st.queue[st.i]].deleted)) st.i++;   // cartão excluído em outro aparelho
  if (st.i >= st.queue.length) {
    return `<div class="study"><div class="fc"><h1 style="text-align:center">Sessão concluída</h1><p class="sub" style="text-align:center">${st.done} revisões · ${st.done ? Math.round(st.ok / st.done * 100) : 0}% de acertos</p>
    <div class="row" style="justify-content:center"><button class="btn" id="endStudy">Voltar aos baralhos</button>${st.failed.length ? `<button class="btn pri" id="again">Revisar ${st.failed.length === 1 ? "o cartão que errei" : `os ${st.failed.length} que errei`}</button>` : ""}</div></div></div>`;
  }
  const c = CARDS[st.queue[st.i]]; const deck = S.decks.find(d => d.id === c.deck);
  return `<div class="study"><div class="row" style="justify-content:space-between"><button class="btn sm ghost" id="endStudy">← Sair</button><span class="sub">${esc(deck?.name || "")} · ${st.i + 1} de ${st.queue.length}</span></div>
  <div class="bar"><div style="width:${st.i / st.queue.length * 100}%"></div></div>
  <div class="fc"><div class="q">${esc(c.front)}</div>${st.shown ? `<div class="a">${esc(c.back)}</div>` : ""}

/* fotos: converte formatos que a IA não aceita (como HEIC do iPad) e reduz as muito grandes */
async function fitImages(list) {
  const lim = AIcaps && AIcaps.images; if (!lim) return list;
  const types = lim.mediaTypes && lim.mediaTypes.length ? lim.mediaTypes : ["image/jpeg", "image/png", "image/webp", "image/gif"];
  const max = lim.maxInputBytes || 5 * 1048576; const out = [];
  for (const b of list) {
    if (!b) continue;
    if (types.includes(b.type) && b.size <= max) { out.push(b); continue; }
    try { out.push(await toJpeg(b, max)); } catch { out.push(b); }
  }
  return out;
}
async function toJpeg(blob, max) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight; const sc = Math.min(1, 2400 / Math.max(w, h, 1)); w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
    for (let q = 0.86; q > 0.4; q -= 0.12) {
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h);
      const out = await new Promise(r => cv.toBlob(r, "image/jpeg", q));
      if (out && out.size <= max) return out;
      w = Math.round(w * 0.8); h = Math.round(h * 0.8);
    }
    throw new Error("imagem grande demais");
  } finally { URL.revokeObjectURL(url); }
}

async function addFiles(files) {
  for (const f of files) {
    const n = f.name || "imagem colada";
    if (/^image\//.test(f.type)) ATT.push({ id: uid(), kind: "image", name: n, blob: f, url: URL.createObjectURL(f) });
    else if (f.type === "application/pdf" || /\.pdf$/i.test(n)) { const a = { id: uid(), kind: "pdf", name: n, text: "", pages: [], status: "lendo…" }; ATT.push(a); renderAtt(); readPdf(f, a); }
    else if (/^text\/|json|csv|markdown/.test(f.type) || /\.(txt|md|csv|json|html?)$/i.test(n)) ATT.push({ id: uid(), kind: "text", name: n, text: (await f.text()).slice(0, 120000) });
    else toast(`Formato não suportado: ${n}. Use imagens, PDF ou texto.`);
  }

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function pdfExtract(data, maxImgPages = 6) {
  if (!window.pdfjsLib) { await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"); window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
  const pdf = await window.pdfjsLib.getDocument({ data: await data.arrayBuffer() }).promise;
  const max = Math.min(pdf.numPages, 60); let txt = ""; const pages = [];
  for (let i = 1; i <= max; i++) { const p = await pdf.getPage(i); const tc = await p.getTextContent(); txt += `\n[Página ${i}]\n` + tc.items.map(x => x.str).join(" "); }
  const scanned = txt.replace(/\[Página \d+\]|\s/g, "").length < 200 * Math.min(max, 3);
  if (scanned) for (let i = 1; i <= Math.min(pdf.numPages, maxImgPages); i++) { const p = await pdf.getPage(i); const vp = p.getViewport({ scale: 1.6 }); const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; await p.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise; pages.push(await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85))); }
  return { text: txt.slice(0, 160000), pages, numPages: pdf.numPages, scanned, truncated: pdf.numPages > max };
}
async function readPdf(file, a) {

    const r = await pdfExtract(file); a.text = r.text.slice(0, 120000); a.pages = r.pages; a.numPages = r.numPages;

}

function parseRanges(txt, qn) {
  const out = new Array(qn).fill("");
  String(txt || "").split(/\n/).forEach(l => {
    const m = l.match(/^\s*(\d+)\s*(?:(?:-|–|a|até)\s*(\d+))?\s*[:=\-–]?\s*(.+?)\s*$/i); if (!m) return;
    const a = +m[1], b = +(m[2] || m[1]); for (let i = Math.max(1, a); i <= Math.min(qn, b); i++) out[i - 1] = m[3];

}
function simStats(s) {
  const q = s.q || []; let a = 0, ag = 0, e = 0, b = 0, nc = 0, g = 0; const bySub = {};
  q.forEach(x => {
    const k = x.s || "Sem disciplina"; const o = bySub[k] = bySub[k] || { a: 0, e: 0, b: 0, g: 0, n: 0 }; o.n++;
    if (x.g) { g++; o.g++; }
    if (x.r === "c") { a++; o.a++; if (x.g) ag++; } else if (x.r === "e") { e++; o.e++; } else if (x.r === "b") { b++; o.b++; } else nc++;
  });

  if (!filled && s.manual != null && s.manual !== "") { a = Math.min(s.qn, +s.manual || 0); e = s.qn - a; nc = 0; manual = true; }
  return { a, ag, consc: a - ag, e, b, nc, g, bySub, pct: s.qn ? a / s.qn : 0, filled, manual, any: filled || manual };
}

async function impLoadFile(file) {
  try {
    if (file.size > 4 * 1048576) return toast("Arquivo muito grande (máximo 4 MB)");
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (bytes[0] === 0x50 && bytes[1] === 0x4B) return toast("Esse é um arquivo .xlsx. Salve a planilha como CSV e envie de novo, ou copie as células e cole aqui.");
    let text;
    if (bytes[0] === 0xFF && bytes[1] === 0xFE) text = new TextDecoder("utf-16le").decode(bytes);
    else if (bytes[0] === 0xFE && bytes[1] === 0xFF) text = new TextDecoder("utf-16be").decode(bytes);
    else { try { text = new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch { text = new TextDecoder("windows-1252").decode(bytes); } }
    IMP.text = text; IMP.fileName = file.name; IMP.done = null; IMP.sig = "";
    if (!IMP.newDeck) IMP.newDeck = file.name.replace(/\.[^.]+$/, "");
    render();
  } catch { toast("Não consegui ler esse arquivo"); }
}

}

  if (Array.isArray(tv)) tv.forEach((s, i) => { if (typeof s !== "object") return; pushSes(String(pick(s, ["materia", "matéria", "subject", "disciplina"]) || ""), toDateKey(pick(s, ["data", "date", "dia", "inicio", "start", "timestamp"])), durSec(s), s.id ?? i); });
  else if (tv && typeof tv === "object") {
    for (const [k, val] of Object.entries(tv)) {
      const v = parseMaybe(val); const dk = toDateKey(k);
      if (dk && typeof v === "number") pushSes("", dk, guessSec(v));
      else if (dk && v && typeof v === "object" && !Array.isArray(v)) { for (const [s2, n] of Object.entries(v)) pushSes(s2, dk, typeof n === "number" ? guessSec(n) : durSec(n)); }
      else if (Array.isArray(v)) v.forEach((s, i) => typeof s === "object" ? pushSes(String(pick(s, ["materia", "subject"]) || (dk ? "" : k)), dk || toDateKey(pick(s, ["data", "date"])), durSec(s), k + i) : pushSes(dk ? "" : k, dk, guessSec(+s), k + i));
      else if (typeof v === "number") pushSes(k, "", guessSec(v));
      else if (v && typeof v === "object") { const inner = Object.entries(v); inner.forEach(([d2, n]) => { const d2k = toDateKey(d2); if (d2k) pushSes(k, d2k, typeof n === "number" ? guessSec(n) : durSec(n)); }); if (!inner.some(([d2]) => toDateKey(d2))) pushSes(k, "", durSec(v)); }
    }
  }
  // provas / datas
  ["vest-provas-v1", "vest-datas-v1"].forEach(key => asList(get(key)).forEach(e => {
    const name = txt(e) || (e._key && !toDateKey(e._key) ? e._key : "") || "Prova";
    let date = toDateKey(pick(e, ["data", "date", "dia", "quando", "dataprova"]) ?? (toDateKey(e._key) ? e._key : (e._val ?? "")));
    if (!date) return; const id = "lg-" + (e.id ?? hash(name + date)); if (S.exams.some(x => x.id === id || (x.name === name && x.date === date))) return;
    S.exams.push({ id, name: String(name), date, tasks: [], note: String(pick(e, ["obs", "local", "nota", "note", "descricao"]) || "") });
  }));
  // agenda
  const dayIdx = d => { if (d == null) return -1; if (typeof d === "number") return d >= 0 && d <= 6 ? d : -1; const s = String(d).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); const L = ["seg", "ter", "qua", "qui", "sex", "sab", "dom"]; const E = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]; let i = L.findIndex(x => s.startsWith(x)); if (i < 0) i = E.findIndex(x => s.startsWith(x)); if (i < 0 && /^\d$/.test(s)) i = (+s + 6) % 7; return i; };
  const hm = v => { const m = String(v || "").match(/(\d{1,2})[:h](\d{2})?/); return m ? `${pad(m[1])}:${m[2] || "00"}` : ""; };
  asList(get("vest-agenda-v1")).forEach((b, i) => {
    const day = dayIdx(pick(b, ["dia", "day", "diasemana", "weekday"]) ?? b._group);
    let start = hm(pick(b, ["inicio", "start", "hora", "horario", "time", "de"])), end = hm(pick(b, ["fim", "end", "ate", "termino", "ate"]));
    if (!start) { const r = String(pick(b, ["horario", "hora"]) || b.text || "").match(/(\d{1,2}[:h]\d{0,2}).{1,4}?(\d{1,2}[:h]\d{0,2})/); if (r) { start = hm(r[1]); end = hm(r[2]); } }
    if (day < 0 || !start) return; if (!end || end <= start) { const [h, m] = start.split(":").map(Number); end = `${pad(Math.min(23, h + 1))}:${pad(m)}`; }
    const title = String(txt(b) || ""), subj = String(pick(b, ["materia", "matéria", "subject", "disciplina"]) || "");
    const id = "lg-" + (b.id ?? hash(day + start + title + subj));
    if (S.agenda.some(x => x.id === id)) return; if (subj) ensureSubject(subj);
    S.agenda.push({ id, day, start, end, title, subject: subj });
  });
  // timer em andamento
  const tm = get("vest-timer-v1");
  if (tm && typeof tm === "object" && !S.timer.running && !S.timer.acc) {
    const running = !!pick(tm, ["running", "rodando", "ativo", "active"]); const st = +pick(tm, ["startedat", "inicio", "start", "starttime", "startts"]) || 0;
    const acc = guessSec(+pick(tm, ["acc", "acumulado", "elapsed", "decorrido", "accumulated", "tempo"]) || 0);
    if (running && st) Object.assign(S.timer, { running: true, startedAt: st < 1e12 ? st * 1000 : st, acc, subject: String(pick(tm, ["materia", "subject"]) || "") });
    else if (acc > 0) Object.assign(S.timer, { acc, subject: String(pick(tm, ["materia", "subject"]) || "") });
  }
  // tema
  const tema = String(get("vest-tema-v1") || ""); if (/claro|light/i.test(tema)) S.settings.light = true;
  S.legacy = { raw: Object.fromEntries(Object.entries(raw).filter(([k]) => k.startsWith("vest-")).map(([k, v]) => [k, typeof v === "string" ? v : JSON.stringify(v)])), importedAt: Date.now() };
  S.settings.migrated = true;
  commit("tasks", "sessions", "exams", "agenda", "settings", "timer", "legacy");
  applyTheme();
  rep.push(["Pendências", S.tasks.length - before.t], ["Sessões de estudo", S.sessions.length - before.s], ["Provas e datas", S.exams.length - before.e], ["Blocos de horário", S.agenda.length - before.a], ["Matérias no total", subjects().length]);
  return rep;
}
function hash(s) { let h = 5381; s = String(s); for (let i = 0; i < s.length; i++) h = (h * 33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36); }
function autoMigrateLocal() { // if the old app's keys exist in this same browser origin, import them once
  if (S.settings.migrated) return;
  const raw = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^vest-/.test(k)) raw[k] = localStorage.getItem(k); } } catch {}
  if (Object.keys(raw).length) { migrateLegacy(raw); toast("Dados do app antigo encontrados e importados"); }
}

/* ============ theme & boot ============ */
function applyTheme() { const r = document.documentElement; r.classList.toggle("light", !!S.settings.light); if (S.settings.accent && S.settings.accent !== "ambar") r.dataset.accent = S.settings.accent; else delete r.dataset.accent; }
document.addEventListener("paste", e => { if (route !== "ia" || iaTab !== "gerar") return; const f = [...(e.clipboardData?.files || [])].filter(x => /^image\//.test(x.type)); if (f.length) { e.preventDefault(); addFiles(f); } });
/* no iPad não existe "passar o mouse": tocar numa barra de gráfico mostra o valor */
document.addEventListener("click", e => { const c = e.target.closest && e.target.closest(".chart .c[title]"); if (c && !c.dataset.sim && c.title) toast(c.title); });
const BOOT_AT = Date.now();
(async function boot() {
  $("#view").innerHTML = `<div class="empty">Carregando seus dados…</div>`;
  try { await loadStore(); } catch (e) { console.warn("cópia local", e); }
  if (!V1INFO || !V1INFO.local) { try { importV1Local(); } catch (e) { console.warn("formato antigo", e); } }
  seedDefaults();
  normalizeAll();
  sortSubjects();
  expireTrash();
  autoMigrateLocal();
  applyTheme();
  route = location.hash.slice(1) || "painel"; if (!ROUTES.some(x => x[0] === route)) route = "painel";
  render();
  setInterval(tick, 1000);
  setInterval(() => { if (route === "painel" || route === "flashcards") renderNav(); }, 60000);
  Cloud.init();
